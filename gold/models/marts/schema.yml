version: 2

models:
  - name: dim_date
    description: One row per market day (Brussels time); quarters_in_day is 92, 96 or 100 on clock-change days.
    columns:
      - name: market_date
        tests: [unique, not_null]
      - name: quarters_in_day
        tests: [not_null, {accepted_values: {arguments: {values: [92, 96, 100], quote: false}}}]
  - name: fct_day_ahead_price
    description: Day-ahead price per bidding zone and quarter-hour (main SDAC auction).
    tests:
      - unique_combination: {arguments: {columns: [bidding_zone, interval_start_utc]}}
    columns:
      - name: market_date
        tests: [{relationships: {arguments: {to: ref('dim_date'), field: market_date}}}]
  - name: fct_cross_border_flow
    description: >
      Net export from Belgium per border and quarter-hour, from ENTSO-E and Elia. When ENTSO-E publishes
      hourly values (NL until 2026-06-29), the comparison uses the mean of Elia's quarter-hours in that hour.
    tests:
      - unique_combination: {arguments: {columns: [neighbour, interval_start_utc]}}
    columns:
      - name: entsoe_resolution
        tests: [{accepted_values: {arguments: {values: [PT15M, PT30M, PT60M]}}}]
      - name: source_difference_mw
        description: ENTSO-E minus Elia at ENTSO-E's resolution; null on quarters not covered by a comparison.
  - name: mart_daily_flow_reconciliation
    description: >
      Cross-source data quality per market day and border — coverage of both sources, error statistics
      and a status (ok, minor_deviation, relevant_deviation, provisional, incomplete).
    tests:
      - unique_combination: {arguments: {columns: [market_date, neighbour]}}
    columns:
      - name: status
        tests:
          - not_null
          - accepted_values: {arguments: {values: [ok, minor_deviation, relevant_deviation, provisional, incomplete]}}
  - name: fct_be_system
    description: Belgian power system per quarter-hour — load, wind, solar, residual load, net exports and price.
    columns:
      - name: interval_start_utc
        tests: [unique, not_null]
      - name: load_mw
        tests: [not_null]
  - name: mart_daily_price_spread
    description: Daily price spread Belgium minus each coupled neighbour, price convergence and average net export.
  - name: mart_daily_forecast_accuracy
    description: Daily accuracy of Elia's day-ahead forecasts for load, wind and solar (MAE, bias, MAPE for load).
  - name: fct_border_flow_price
    description: >
      Physical cross-border flow (Elia) against the day-ahead price signal, per coupled border and quarter-hour.
      Physical flows can run against prices because of loop and transit flows; this is not the commercial exchange.
    tests:
      - unique_combination: {arguments: {columns: [neighbour, interval_start_utc]}}
    columns:
      - name: flow_vs_price
        tests:
          - not_null
          - accepted_values: {arguments: {values: [converged, not_significant, with_price, against_price]}}
      - name: flow_price_value_eur
        description: Quarter-hour energy valued at the destination-minus-origin price spread; negative when against price.
  - name: mart_monthly_border_flow_price
    description: Monthly price convergence and share of physical flow running with or against the price signal, per coupled border.
    tests:
      - unique_combination: {arguments: {columns: [month, neighbour]}}
  - name: fct_cnec_hourly
    description: >
      Non-redundant Core CNECs per hour with RAM/Fmax against JAO's published minRAM target
      (indicative compliance with the 70 % rule, including each TSO's derogation or action plan).
    tests:
      - unique_combination: {arguments: {columns: [interval_start_utc, tso, cne_name, direction, contingency_name]}}
    columns:
      - name: tso
        tests: [{relationships: {arguments: {to: ref('tsos'), field: tso}}}]
  - name: mart_monthly_min_ram
    description: Monthly minRAM indicators per Core TSO — share of CNEC-hours meeting the target, AMR and IVA use.
    tests:
      - unique_combination: {arguments: {columns: [month, tso]}}
  - name: mart_monthly_active_constraints
    description: Monthly binding Core CNECs (shadow price > 0) — how often they limited the market and at what shadow price.
    columns:
      - name: tso
        tests: [{relationships: {arguments: {to: ref('tsos'), field: tso}}}]
  - name: fct_border_commercial_physical
    description: Commercial scheduled exchange (JAO) vs physical flow (Elia) per Belgian border and quarter-hour; the difference is unscheduled flow.
    tests:
      - unique_combination: {arguments: {columns: [neighbour, interval_start_utc]}}
  - name: mart_monthly_unscheduled_flow
    description: Monthly commercial vs physical flow and unscheduled (loop/transit) flow per Belgian border.
    tests:
      - unique_combination: {arguments: {columns: [month, neighbour]}}

