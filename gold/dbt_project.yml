name: grid_lakehouse
version: "0.1.0"
config-version: 2
profile: grid_lakehouse

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

vars:
  # Carpeta de datos, relativa a gold/ (desde donde se ejecuta dbt)
  data_dir: "../data"
  # 'delta' en el Mac; 'parquet' solo para pruebas sin la extensión delta de DuckDB
  silver_format: "delta"
  # Reconciliación de flujos ENTSO-E vs Elia (mart_daily_flow_reconciliation)
  flow_tolerance_mw: 1          # por debajo, las dos fuentes se consideran iguales (redondeos)
  flow_relevant_max_mw: 50      # un intervalo con más diferencia que esto hace el día "relevante"
  flow_relevant_mae_mw: 5       # o una diferencia media diaria por encima de esto
  revision_days: 7              # días recientes que la ingesta vuelve a descargar: aún pueden cambiar

models:
  grid_lakehouse:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: gold

seeds:
  grid_lakehouse:
    +schema: reference

flags:
  send_anonymous_usage_stats: false
